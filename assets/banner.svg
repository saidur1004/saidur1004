<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%" role="img" aria-label="MD Saidur Rahman Bhuyan - Junior Flutter Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="glowLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.55" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="300" rx="16" ry="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base background -->
    <rect width="1200" height="300" fill="url(#bgGrad)" />
    <rect width="1200" height="300" fill="url(#gridPattern)" />

    <!-- Ambient glow orbs -->
    <circle cx="140" cy="60" r="240" fill="url(#glowLeft)" />
    <circle cx="1060" cy="240" r="260" fill="url(#glowRight)" />

    <!-- Top accent bar -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

    <!-- Subtle decorative mobile/code geometry on right -->
    <g transform="translate(875, 42)" opacity="0.9">
      <!-- Abstract device frame -->
      <rect x="0" y="0" width="250" height="216" rx="14" fill="#0B1220" stroke="#1E293B" stroke-width="1.5" />
      <rect x="0" y="0" width="250" height="28" rx="14" fill="#111C33" />
      <rect x="0" y="16" width="250" height="12" fill="#111C33" />
      <circle cx="18" cy="14" r="4" fill="#F87171" opacity="0.85" />
      <circle cx="32" cy="14" r="4" fill="#FBBF24" opacity="0.85" />
      <circle cx="46" cy="14" r="4" fill="#34D399" opacity="0.85" />
      <text x="125" y="18" text-anchor="middle" fill="#94A3B8" font-family="Consolas, 'Courier New', monospace" font-size="11">main.dart</text>

      <!-- Code lines -->
      <text x="18" y="54" fill="#38BDF8" font-family="Consolas, 'Courier New', monospace" font-size="12">class <tspan fill="#E2E8F0">Developer</tspan> {</text>
      <text x="30" y="76" fill="#94A3B8" font-family="Consolas, 'Courier New', monospace" font-size="11.5">role: <tspan fill="#34D399">'Junior Flutter Dev'</tspan>,</text>
      <text x="30" y="96" fill="#94A3B8" font-family="Consolas, 'Courier New', monospace" font-size="11.5">stack: <tspan fill="#FBBF24">['Dart', 'Firebase']</tspan>,</text>
      <text x="30" y="116" fill="#94A3B8" font-family="Consolas, 'Courier New', monospace" font-size="11.5">backend: <tspan fill="#A5B4FC">'Django / DRF'</tspan>,</text>
      <text x="30" y="136" fill="#94A3B8" font-family="Consolas, 'Courier New', monospace" font-size="11.5">focus: <tspan fill="#38BDF8">'Clean Mobile UI'</tspan>,</text>
      <text x="18" y="158" fill="#38BDF8" font-family="Consolas, 'Courier New', monospace" font-size="12">}</text>

      <!-- Status pill inside terminal -->
      <rect x="18" y="174" width="214" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="33" cy="187" r="4" fill="#22C55E" />
      <text x="45" y="191" fill="#CBD5E1" font-family="Consolas, 'Courier New', monospace" font-size="11">Dhaka, BD • Building Apps</text>
    </g>

    <!-- Left Content -->
    <g transform="translate(64, 62)">
      <!-- Eyebrow badge -->
      <rect x="0" y="0" width="248" height="28" rx="14" fill="#0F2942" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38BDF8" />
      <text x="28" y="18" fill="#7DD3FC" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">JUNIOR FLUTTER DEVELOPER</text>

      <!-- Main Name -->
      <text x="0" y="76" fill="#F8FAFC" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">MD Saidur Rahman Bhuyan</text>

      <!-- Subtitle -->
      <text x="0" y="110" fill="#94A3B8" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Cross-Platform Mobile Applications  •  REST APIs &amp; Firebase  •  App Store &amp; Play Store</text>

      <!-- Accent rule -->
      <rect x="0" y="130" width="120" height="3" rx="1.5" fill="url(#accentGrad)" />

      <!-- Tech Pills -->
      <g transform="translate(0, 152)">
        <rect x="0" y="0" width="122" height="30" rx="8" fill="#111C33" stroke="#1E293B" stroke-width="1" />
        <text x="61" y="19" text-anchor="middle" fill="#38BDF8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600">Flutter &amp; Dart</text>

        <rect x="134" y="0" width="166" height="30" rx="8" fill="#111C33" stroke="#1E293B" stroke-width="1" />
        <text x="217" y="19" text-anchor="middle" fill="#FBBF24" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600">Firebase &amp; REST APIs</text>

        <rect x="312" y="0" width="162" height="30" rx="8" fill="#111C33" stroke="#1E293B" stroke-width="1" />
        <text x="393" y="19" text-anchor="middle" fill="#34D399" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600">Django &amp; DRF</text>

        <rect x="486" y="0" width="162" height="30" rx="8" fill="#111C33" stroke="#1E293B" stroke-width="1" />
        <text x="567" y="19" text-anchor="middle" fill="#A5B4FC" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600">Clean Architecture</text>
      </g>
    </g>

    <!-- Outer border -->
    <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="16" ry="16" fill="none" stroke="#1E293B" stroke-width="1.5" />
  </g>
</svg>
